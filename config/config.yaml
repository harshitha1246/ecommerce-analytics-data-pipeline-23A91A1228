# E-Commerce Data Pipeline Configuration

# Database Configuration
database:
  host: localhost
  port: 5432
  name: ecommerce_db
  user: admin
  password: password
  schemas:
    staging: staging
    production: production
    warehouse: warehouse

# Data Generation Configuration
data_generation:
  num_customers: 1000
  num_products: 500
  num_transactions: 10000
  min_transaction_items: 1
  max_transaction_items: 5
  date_range_days: 365
  seed: 42

# Data Processing
processing:
  batch_size: 1000
  max_retries: 3
  retry_backoff_seconds: [1, 2, 4]
  timeout_seconds: 300

# Logging Configuration
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  directory: ./logs

# File Paths
paths:
  raw_data: ./data/raw
  staging_data: ./data/staging
  processed_data: ./data/processed
  logs: ./logs
  sql_scripts: ./sql

# Pipeline Configuration
pipeline:
  enable_data_generation: true
  enable_ingestion: true
  enable_quality_checks: true
  enable_transformation: true
  enable_warehouse_load: true
  enable_analytics: true

# Quality Check Configuration
quality_checks:
  completeness_weight: 0.25
  uniqueness_weight: 0.15
  validity_weight: 0.20
  consistency_weight: 0.20
  referential_integrity_weight: 0.20
  quality_score_threshold: 85

# Scheduling Configuration
scheduling:
  enabled: false
  schedule_time: '02:00'
  timezone: UTC
  retention_days: 7
